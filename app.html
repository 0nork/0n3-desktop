<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'">
<title>0n3</title>
<style>
:root{--bg:#0c0e0c;--panel:#121512;--card:#171b17;--line:#252b25;--ink:#eef3ee;--mut:#8e988e;--neon:#7ed957;--deep:#408b1f;--bad:#f87171;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,Inter,system-ui,sans-serif}
body{display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);-webkit-app-region:drag;background:var(--panel)}
.top img{height:22px}.top .grow{flex:1}.top button,.top a,.top select{-webkit-app-region:no-drag}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}.dot.on{background:var(--neon);box-shadow:0 0 8px var(--neon)}.dot.busy{background:var(--neon);animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.25}}
.st{color:var(--mut);font-size:12px}
.x{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer;padding:2px 6px}.x:hover{color:var(--ink)}
.tabs{display:flex;gap:4px;padding:8px 14px 0;background:var(--panel)}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:8px 12px;font:600 13px inherit;cursor:pointer}.tab.on{color:var(--ink);border-color:var(--neon)}
.pane{flex:1;min-height:0;display:none;flex-direction:column}.pane.on{display:flex}
/* terminal */
.bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--mut)}
.bar button{background:#1d221d;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 10px;font:12px inherit;cursor:pointer;white-space:nowrap}.bar button:hover{border-color:var(--deep)}.bar button:disabled{opacity:.4;cursor:default}
.bar .cwd{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.bar .cwd:hover{color:var(--ink)}
#log{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.me{align-self:flex-end;max-width:88%;background:var(--neon);color:#0b0d0b;border-radius:14px 14px 4px 14px;padding:8px 12px;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.me.cmd{background:#0f120f;color:var(--neon);border:1px solid var(--deep);font:600 13px var(--mono)}
.ai{align-self:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.ai .tx{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.ai .tx b{color:#fff}.ai code{font:12.5px var(--mono);background:#0f120f;border:1px solid var(--line);border-radius:5px;padding:0 4px}
.step{font:12px var(--mono);color:#9ccf8c;display:flex;gap:6px;align-items:flex-start}.step:before{content:"▸";color:var(--neon)}.step.ok:after{content:"✓";color:var(--neon);margin-left:auto}.step.bad{color:var(--bad)}.step.bad:after{content:"✗";margin-left:auto}
.out{font:12px/1.5 var(--mono);color:#c8d3c8;white-space:pre-wrap;overflow-wrap:anywhere;background:#0b0d0b;border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-height:340px;overflow:auto}
.meta{font:11px var(--mono);color:var(--mut)}.err{color:var(--bad);font:12px var(--mono);white-space:pre-wrap}
.cursor{display:inline-block;width:7px;height:14px;background:var(--neon);vertical-align:-2px;margin-left:2px;animation:pulse .9s infinite}
.empty{color:var(--mut);text-align:center;margin:auto;max-width:420px;line-height:1.6}.empty b{color:var(--ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 0}.quick button{background:#1a1f1a;border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:5px 11px;font-size:12px;cursor:pointer;white-space:nowrap}.quick button:hover{border-color:var(--neon)}
form{display:flex;gap:8px;padding:10px 14px 14px;align-items:flex-end}
textarea{flex:1;min-width:0;resize:none;background:#0b0d0b;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:13.5px/1.45 var(--mono);max-height:180px;outline:none}textarea:focus{border-color:var(--deep)}
.go{background:var(--neon);color:#0b0d0b;border:0;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;white-space:nowrap}.go:disabled{opacity:.5}
/* commands */
#cmds{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:16px}
.grp h3{margin:0 0 8px;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--neon)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cmd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:3px;font:inherit}.cmd:hover{border-color:var(--neon);transform:translateY(-1px)}
.cmd b{font-size:13px}.cmd small{color:var(--mut);font-size:11.5px;line-height:1.35}
.cmd.mine{border-style:dashed}
.add{display:flex;gap:6px;flex-wrap:wrap}.add input{flex:1;min-width:120px;background:#0b0d0b;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit}
.add button{background:#1d221d;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a312a;border-radius:10px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="top"><img src="assets/logo-light.png" alt="0n3"><span class="dot" id="dot"></span><span class="st" id="st">starting…</span><span class="grow"></span><button class="x" id="hide" title="Hide (⌘⇧Space)">×</button></div>
<div class="tabs"><button class="tab on" data-p="term">Terminal</button><button class="tab" data-p="cmds">Commands</button><button class="tab" data-p="jobs">Jobs &amp; phone ↗</button></div>

<section class="pane on" id="p-term">
  <div class="bar"><span class="cwd" id="cwd" title="Click to choose the folder it works in">~</span><button id="new" title="Start a fresh conversation">New</button><button id="stop" disabled>Stop</button></div>
  <div id="log"><div class="empty" id="empty"><b>This is your terminal.</b><br>Talk to it like you talk to me: plain English, and it works on this computer and in every app you connected to 0n3. Start a line with <code>$</code> to run a command yourself. Or pick one from <b>Commands</b>.</div></div>
  <div class="quick" id="quick"></div>
  <form id="f"><textarea id="in" rows="1" placeholder="Ask anything, or $ a command   (Enter to send · Shift+Enter new line · ↑ history)"></textarea><button class="go" id="go">Send</button></form>
</section>

<section class="pane" id="p-cmds"><div id="cmds"></div></section>
<section class="pane" id="p-jobs"></section>

<script src="app.js"></script>
</body>
</html>
