<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>0n3</title>
<script src="looks.js"></script>
<style>
  :root { --bg: #0a0d0a; --rgb: 126,217,87; --neon: #7ed957; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  /* the ring is the drag handle; the button inside is the click target (a drag region never receives clicks) */
  #ring { position: absolute; inset: 0; border-radius: 50%; -webkit-app-region: drag; }
  /* a glass bead in the theme's colors: a lit top-left, a dark body, the accent as the ring. No blur, nothing that loops. */
  #btn { position: absolute; left: 6px; top: 6px; width: 52px; height: 52px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; -webkit-app-region: no-drag;
         display: flex; align-items: center; justify-content: center; color: var(--neon);
         background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.34), rgba(255,255,255,0) 46%), radial-gradient(circle at 70% 90%, rgba(var(--rgb),.3), rgba(var(--rgb),0) 55%), linear-gradient(150deg, color-mix(in srgb, var(--bg) 72%, #fff 9%), var(--bg));
         box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 18px rgba(0,0,0,.3), 0 0 0 2px rgba(var(--rgb),.6); transition: transform .12s ease, box-shadow .12s ease; }
  #btn:hover { transform: scale(1.06); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 22px rgba(0,0,0,.34), 0 0 0 3px rgba(var(--rgb),.85); }
  #btn:active { transform: scale(.96); }
  #btn svg { width: 28px; height: 28px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  #btn img { width: 32px; height: 32px; }
</style>
</head>
<body>
  <div id="ring"></div>
  <button id="btn" title="0n3 — your AI (⌘⇧Space)" aria-label="Open the 0n3 chat"></button>
  <script>
    const btn = document.getElementById('btn');
    btn.addEventListener('click', () => window.on3bubble && window.on3bubble.toggle());
    // The icon and the colors are the person's choice in Settings (looks.js owns the lists; main keeps the choice).
    function paint(o) { const look = LOOKS.apply(o); btn.dataset.icon = look.icon; btn.innerHTML = LOOKS.icon(look.icon) || '<img src="assets/bubble.png" alt="">'; }
    paint(LOOKS.read());
    if (window.on3look) { window.on3look.on(paint); window.on3look.get().then((l) => { if (l) paint(l); }).catch(() => {}); }
  </script>
</body>
</html>
